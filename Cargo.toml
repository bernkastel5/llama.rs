[package]
name = "llama-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
half = "2.4"
memmap2 = "0.9"
rand = "0.8"
rayon = "1.10"
safetensors = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokenizers = "0.19"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
